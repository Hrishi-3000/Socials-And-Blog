<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hrishikesh Shahane | Digital Hub</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>

  <!-- Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
          animation: {
            'blob': 'blob 10s infinite',
            'fade-in': 'fadeIn 0.6s ease-out forwards',
            'slide-up': 'slideUp 0.6s ease-out forwards',
          },
          keyframes: {
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    
    /* Glassmorphism Utilities */
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .dark .glass-card {
      background: rgba(17, 24, 39, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    /* Smooth transition for theme toggle */
    body { transition: background-color 0.5s ease, color 0.5s ease; }
  </style>
</head>

<body class="antialiased selection:bg-indigo-500 selection:text-white min-h-screen text-gray-900 dark:text-gray-100 bg-gray-50 dark:bg-[#0a0a0a] transition-colors duration-500">

  <!-- Background Effects -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <!-- Dark Mode Aurora -->
    <div class="hidden dark:block absolute inset-0">
      <div class="absolute top-0 left-1/4 w-96 h-96 bg-indigo-600/20 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob"></div>
      <div class="absolute top-0 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob" style="animation-delay: 2s"></div>
      <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-pink-600/20 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob" style="animation-delay: 4s"></div>
      <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 brightness-100 contrast-150"></div>
    </div>
    <!-- Light Mode Gradient -->
    <div class="block dark:hidden absolute inset-0">
      <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
      <div class="absolute top-0 right-1/4 w-96 h-96 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob" style="animation-delay: 2s"></div>
      <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-pink-200 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob" style="animation-delay: 4s"></div>
      <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-10"></div>
    </div>
  </div>

  <!-- Main Container -->
  <div class="relative z-10 max-w-3xl mx-auto px-6 py-12 md:py-20">

    <!-- Header -->
    <header class="flex flex-col items-center text-center mb-12 animate-fade-in">
      <div class="relative w-32 h-32 mb-6 group">
        <div class="absolute inset-0 bg-indigo-500 rounded-full blur opacity-40 group-hover:opacity-60 transition-opacity duration-500"></div>
        <img 
          src="https://ui-avatars.com/api/?name=Hrishikesh+Shahane&background=6366f1&color=fff&size=256&bold=true" 
          alt="Avatar" 
          class="relative w-32 h-32 rounded-full border-4 border-white dark:border-gray-800 shadow-2xl object-cover transform transition-transform duration-500 group-hover:scale-105 group-hover:rotate-3"
        />
        <button 
          id="themeToggle"
          class="absolute bottom-0 right-0 p-2.5 bg-white dark:bg-gray-800 rounded-full shadow-lg border border-gray-200 dark:border-gray-700 text-indigo-600 dark:text-yellow-400 hover:scale-110 transition-transform cursor-pointer"
        >
          <i data-feather="sun" class="w-5 h-5 hidden dark:block"></i>
          <i data-feather="moon" class="w-5 h-5 block dark:hidden"></i>
        </button>
      </div>
      
      <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-gray-900 via-indigo-800 to-gray-900 dark:from-white dark:via-indigo-200 dark:to-white mb-3 tracking-tight">
        Hrishikesh Shahane
      </h1>
      <p class="text-lg text-gray-600 dark:text-gray-300 max-w-lg mx-auto leading-relaxed">
        Exploring the intersection of technology, history, and art. Building digital experiences that matter.
      </p>
    </header>

    <!-- Sticky Search -->
    <div class="sticky top-6 z-20 mb-12 animate-slide-up" style="animation-delay: 100ms;">
      <div class="relative group">
        <div class="absolute inset-0 bg-indigo-500 rounded-2xl blur opacity-20 group-hover:opacity-30 transition-opacity"></div>
        <div class="relative flex items-center bg-white/80 dark:bg-gray-900/80 backdrop-blur-xl border border-gray-200 dark:border-gray-700 rounded-2xl shadow-lg transition-all focus-within:ring-2 focus-within:ring-indigo-500/50 focus-within:border-indigo-500">
          <i data-feather="search" class="ml-4 text-gray-400 w-5 h-5"></i>
          <input 
            id="searchInput"
            type="text"
            placeholder="Search links, projects, blogs..."
            class="w-full bg-transparent border-none px-4 py-4 text-gray-800 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-0"
          />
          <button 
            id="clearSearch"
            class="hidden mr-4 text-xs font-medium text-gray-400 hover:text-indigo-500 uppercase tracking-wider"
          >
            Clear
          </button>
        </div>
      </div>
    </div>

    <!-- Links Container -->
    <main id="linksContainer" class="space-y-10 min-h-[300px]">
      <!-- Content injected by JS -->
    </main>

    <!-- Footer -->
    <footer class="mt-20 pt-10 border-t border-gray-200 dark:border-white/10 text-center animate-fade-in" style="animation-delay: 600ms;">
      <a href="https://hrishikesh-shahane-portfolio.vercel.app/" class="inline-flex items-center gap-2 px-6 py-3 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-full font-semibold shadow-xl hover:shadow-2xl hover:scale-105 transition-all duration-300 mb-8">
        <i data-feather="code" class="w-4 h-4"></i>
        <span>Visit Full Portfolio</span>
      </a>
      <p class="text-sm text-gray-500 dark:text-gray-400 flex items-center justify-center gap-1.5">
        Designed by Hrishikesh Shahane
      </p>
      <p class="text-xs text-gray-400 dark:text-gray-600 mt-2">© 2025 All Rights Reserved.</p>
    </footer>

  </div>

  <!-- Javascript Logic -->
  <script>
    // --- Data ---
    const LINKS = [
      // Projects
      { title: "Portfolio Website", url: "https://hrishikesh-shahane-portfolio.vercel.app/", category: "Projects", icon: "globe", desc: "My main professional showcase." },
      { title: "Hrishikesh’s Archives", url: "https://hrishikesh-archives.vercel.app/", category: "Projects", icon: "archive", desc: "Digital collection of resources." },
      { title: "Devotional Portal", url: "https://devotional-portal-by-hrishikesh.vercel.app/", category: "Projects", icon: "sun", desc: "Spiritual resources and texts." },
      { title: "Game Collection", url: "https://hrishi-game-collection.vercel.app/", category: "Projects", icon: "play-circle", desc: "Games I enjoy or developed." },
      { title: "My Desh", url: "https://my-desh-india.vercel.app/", category: "Projects", icon: "flag", desc: "Dedicated to Indian heritage." },
      
      // Socials
      { title: "LinkedIn", url: "https://www.linkedin.com/in/hrishikesh-shahane-a0a19a258/", category: "Socials", icon: "linkedin" },
      { title: "GitHub", url: "https://github.com/Hrishi-3000", category: "Socials", icon: "github" },
      { title: "Blogger Profile", url: "https://hrishikeshshahane-aboutme.blogspot.com/p/about-me.html", category: "Socials", icon: "user" },
      { title: "MyAnimeList", url: "https://myanimelist.net/profile/Hrishikesh__2003", category: "Socials", icon: "tv" },
      { title: "X (Twitter)", url: "https://x.com/Hrishikesh_3000", category: "Socials", icon: "twitter" },
      { title: "Reddit", url: "https://www.reddit.com/u/Hrishi_2003", category: "Socials", icon: "message-square" },
      { title: "Pinterest", url: "https://pin.it/72QDEvxGw", category: "Socials", icon: "image" },
      { title: "Instagram (Main)", url: "https://www.instagram.com/hrishikesh__2003", category: "Socials", icon: "instagram" },
      { title: "Instagram (Art)", url: "https://www.instagram.com/art_for_hobbie", category: "Socials", icon: "pen-tool" },
      { title: "Discord", url: "https://discord.gg/ySDEerp7", category: "Socials", icon: "message-circle" },
      { title: "Tumblr", url: "https://www.tumblr.com/hrishikes2003", category: "Socials", icon: "book-open" },

      // Blogs
      { title: "Treaties under Maratha Empire", url: "https://treatiesmarathaempire.blogspot.com/?m=1", category: "Blogs", icon: "file-text", desc: "Historical analysis." },
      { title: "Key Battles of WW2", url: "https://hrishiimportantbattles.blogspot.com/?m=1", category: "Blogs", icon: "shield", desc: "Deep dive into pivotal moments." },
      { title: "Fascinating Historical Treaties", url: "https://hrishihistoryfacts.blogspot.com/?m=1", category: "Blogs", icon: "feather", desc: "Curated facts." },
      { title: "Nationalists Across the World", url: "https://nationalistsacrosstheworld.blogspot.com/?m=1", category: "Blogs", icon: "map", desc: "Stories of nationalism." },
      { title: "Dashavatar of Vishnu", url: "https://dashavatar-vishnu.blogspot.com/?m=1", category: "Blogs", icon: "sun", desc: "Mythological exploration." },
      { title: "Dynasties in Bharat Phase 1", url: "https://bharatdynastichistory1.blogspot.com//?m=1", category: "Blogs", icon: "Globe", desc: "Heritage." },
    ];

    // --- State & Config ---
    const container = document.getElementById('linksContainer');
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearSearch');
    const themeBtn = document.getElementById('themeToggle');
    
    // --- Theme Logic ---
    let isDark = localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    
    function updateTheme() {
      if (isDark) {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      }
      feather.replace();
    }
    
    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      updateTheme();
    });

    // --- Render Logic ---
    function renderLinks(filter = "") {
      const term = filter.toLowerCase();
      const filtered = LINKS.filter(l => 
        l.title.toLowerCase().includes(term) || 
        l.category.toLowerCase().includes(term) ||
        (l.desc && l.desc.toLowerCase().includes(term))
      );

      container.innerHTML = "";

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 animate-fade-in">
            <p class="text-xl text-gray-500 dark:text-gray-400">No results found for "${filter}"</p>
          </div>
        `;
        return;
      }

      const categories = ['Projects', 'Socials', 'Blogs'];
      
      let delayCounter = 200;

      categories.forEach(cat => {
        const catLinks = filtered.filter(l => l.category === cat);
        if (catLinks.length === 0) return;

        // Section Title
        const section = document.createElement('div');
        section.className = "animate-fade-in";
        section.style.animationDelay = `${delayCounter}ms`;
        section.innerHTML = `
          <h2 class="text-lg font-bold text-gray-800 dark:text-white mb-4 flex items-center gap-2 px-1">
            <span class="w-1 h-6 bg-indigo-500 rounded-full"></span>
            ${cat}
            <span class="text-xs font-normal text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 px-2 py-0.5 rounded-full ml-2">
              ${catLinks.length}
            </span>
          </h2>
        `;

        // Grid
        const grid = document.createElement('div');
        grid.className = "grid grid-cols-1 md:grid-cols-2 gap-x-4";

        catLinks.forEach((link, idx) => {
          const cardDelay = delayCounter + (idx * 50);
          const card = document.createElement('a');
          card.href = link.url;
          card.target = "_blank";
          card.className = "glass-card group relative flex items-center p-4 mb-3 rounded-2xl hover:shadow-xl hover:shadow-indigo-500/10 dark:hover:shadow-indigo-900/20 transition-all duration-300 ease-out hover:-translate-y-1 overflow-hidden animate-slide-up opacity-0";
          card.style.animationDelay = `${cardDelay}ms`;
          
          const iconType = link.icon || 'external-link';
          
          card.innerHTML = `
            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-700 ease-in-out"></div>
            <div class="flex-shrink-0 mr-4 flex items-center justify-center w-12 h-12 rounded-xl bg-gray-100 dark:bg-gray-700/50 text-gray-600 dark:text-gray-300 group-hover:bg-indigo-500 group-hover:text-white transition-colors duration-300">
              <i data-feather="${iconType}"></i>
            </div>
            <div class="flex-grow min-w-0">
              <h3 class="text-base font-semibold text-gray-800 dark:text-gray-100 truncate group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">${link.title}</h3>
              ${link.desc ? `<p class="text-xs text-gray-500 dark:text-gray-400 truncate mt-0.5">${link.desc}</p>` : ''}
            </div>
            <div class="ml-3 text-gray-400 group-hover:text-indigo-500 group-hover:translate-x-1 transition-all duration-300">
              <i data-feather="${link.category === 'Projects' ? 'arrow-right' : 'external-link'}" class="w-4 h-4"></i>
            </div>
          `;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        container.appendChild(section);
        delayCounter += 100;
      });

      feather.replace();
    }

    // --- Event Listeners ---
    searchInput.addEventListener('input', (e) => {
      const val = e.target.value;
      clearBtn.style.display = val ? 'block' : 'none';
      renderLinks(val);
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.style.display = 'none';
      renderLinks();
    });

    // --- Init ---
    updateTheme();
    renderLinks();

  </script>
</body>
</html>
