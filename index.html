<!DOCTYPE html>
<html lang="en">
<head>

<title>Hrishikesh Shahane – Digital Hub</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>

<style>
body {
  font-family: 'Poppins', sans-serif;
  transition: background 0.4s ease, color 0.4s ease;
}

/* Animated gradient background */
.bg-animated {
  background: linear-gradient(-45deg, #000, #111, #1a1a1a, #000);
  background-size: 400% 400%;
  animation: gradient 12s ease infinite;
}

@keyframes gradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Glass card */
.glass {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.08);
}

/* Hover lift */
.lift:hover {
  transform: translateY(-4px) scale(1.02);
}

/* Fade animation */
.fade {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.7s forwards;
}
@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body id="page" class="min-h-screen bg-animated text-white p-6 md:p-10">

<!-- HEADER -->
<header class="flex flex-col md:flex-row justify-between items-center mb-10 fade">

    <button id="modeToggle"

</h2>

</div>

<!-- CTA -->
<div class="text-center mt-14 fade">
<a href="https://hrishikesh-shahane-portfolio.vercel.app/"
 class="inline-block bg-white text-black px-8 py-4 rounded-2xl font-semibold hover:scale-105 transition">
Visit My Portfolio 🚀
</a>
</div>

<script>
/* Theme toggle */
const page = document.getElementById("page");
const btn = document.getElementById("modeToggle");
let dark = true;

btn.onclick = () => {
  dark = !dark;
  page.className = dark
    ? "min-h-screen bg-animated text-white p-6 md:p-10"
    : "min-h-screen bg-white text-black p-6 md:p-10";
  btn.innerHTML = dark ? feather.icons.sun.toSvg() : feather.icons.moon.toSvg();
  feather.replace();
};

/* Search filter */
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll(".link-item").forEach(li => {
    li.style.display = li.innerText.toLowerCase().includes(q) ? "block" : "none";
  });
});

feather.replace();
</script>

</body>
</html>
